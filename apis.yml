name: SmartRent
description: >-
  SmartRent, Inc. (NYSE: SMRT), founded in 2017 and headquartered in Scottsdale,
  Arizona, is a leading provider of smart home and smart property technology for
  the multifamily and single-family rental industries. Its platform pairs smart
  hardware — smart locks, thermostats, water/leak sensors, access control and
  hubs (Alloy, Fusion) — with cloud-based SaaS for property operators to manage
  connected devices at scale. Products span smart apartments, building and
  common-area access control, asset protection and leak monitoring, parking
  management, self-guided tours, Virtual Intercom (browser-based WebRTC entry),
  and community/resident WiFi. SmartRent exposes a partner-gated REST API and a
  Phoenix Sockets real-time API for integrations, but publishes no public
  developer portal or OpenAPI; API credentials are provisioned on request via
  api@smartrent.com. This profile was surfaced as a VC portfolio company and
  enriched by the API Evangelist pipeline.
